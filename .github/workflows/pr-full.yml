name: PR Full Suite (E2E + Visual + a11y + Billing)

# Runs on every pull request. Target < 12 minutes.
on:
  pull_request:
    branches: ['main']

jobs:
  e2e-and-visual:
    name: E2E + Visual + Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: billingtool_test
          MYSQL_USER: billingtool
          MYSQL_PASSWORD: billingtool_test
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install JS dependencies
        run: npm ci

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, intl, curl, gd, fileinfo
          coverage: none

      - name: Install Composer dependencies
        working-directory: api
        run: composer install --no-dev --no-interaction --prefer-dist

      - name: Configure CI4 .env
        working-directory: api
        run: |
          cp env .env
          sed -i 's/# CI_ENVIRONMENT = production/CI_ENVIRONMENT = testing/' .env
          sed -i "s/database.default.hostname.*/database.default.hostname = 127.0.0.1/" .env
          sed -i "s/database.default.database.*/database.default.database = billingtool_test/" .env
          sed -i "s/database.default.username.*/database.default.username = billingtool/" .env
          sed -i "s/database.default.password.*/database.default.password = billingtool_test/" .env

      - name: Run migrations and seed
        working-directory: api
        run: |
          php spark migrate --all
          php spark db:seed MainSeeder || echo "Seeder failed — continuing"

      - name: Start API server
        working-directory: api
        run: php spark serve --host 127.0.0.1 --port 8080 &

      - name: Wait for API
        run: |
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:8080/ping && break; sleep 2; done

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_URL: http://127.0.0.1:8080

      - name: Serve frontend build
        run: npx vite preview --port 3000 &
        env:
          CI: true

      - name: Wait for frontend
        run: |
          for i in $(seq 1 15); do curl -sf http://localhost:3000 && break; sleep 2; done

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      # ── Smoke tests ─────────────────────────────────────────────────────────
      - name: Run smoke tests (navigation, BUG-010, BUG-002)
        run: npx playwright test --project=smoke
        env:
          CI: true
          API_URL: http://127.0.0.1:8080
          FRONTEND_URL: http://localhost:3000

      # ── WorkHub E2E ──────────────────────────────────────────────────────────
      - name: Run WorkHub E2E tests
        run: npx playwright test --project=workhub
        env:
          CI: true
          API_URL: http://127.0.0.1:8080
          FRONTEND_URL: http://localhost:3000
        continue-on-error: true  # don't block on known skipped tests

      # ── Visual regression ────────────────────────────────────────────────────
      - name: Run visual regression tests
        run: npx playwright test --project=visual
        env:
          CI: true
          API_URL: http://127.0.0.1:8080
          FRONTEND_URL: http://localhost:3000
        continue-on-error: true  # new baselines may not exist yet on first run

      # ── Billing E2E (invoice editor) ─────────────────────────────────────────
      - name: Run billing E2E tests
        run: npx playwright test --project=billing
        env:
          CI: true
          API_URL: http://127.0.0.1:8080
          FRONTEND_URL: http://localhost:3000
        continue-on-error: true

      # ── Accessibility ────────────────────────────────────────────────────────
      - name: Run accessibility tests (axe-core WCAG 2.0 AA)
        run: npx playwright test --project=a11y
        env:
          CI: true
          API_URL: http://127.0.0.1:8080
          FRONTEND_URL: http://localhost:3000

      # ── Report ───────────────────────────────────────────────────────────────
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-full-report
          path: |
            playwright-report/
            e2e/snapshots/
          retention-days: 14

      # Post a comment on the PR with the artifact link
      - name: Comment PR with report link
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Test Results\n\n[View full test report](${runUrl})\n\nDownload the \`pr-full-report\` artifact for the HTML report with screenshots and traces.`
            });
