version: '3.9'

# Test-only services. Start with:
#   docker compose -f docker-compose.test.yml up -d
# Stop with:
#   docker compose -f docker-compose.test.yml down

services:
  # ── Mailpit — SMTP sink for email notification tests ────────────────────────
  # Web UI:    http://localhost:8025
  # SMTP port: 1025 (no auth required in test mode)
  # REST API:  http://localhost:8025/api/v1/messages  (read captured emails)
  mailpit:
    image: axllent/mailpit:latest
    container_name: billingtool_mailpit
    restart: unless-stopped
    ports:
      - '1025:1025'   # SMTP
      - '8025:8025'   # Web UI + REST API
    environment:
      MP_MAX_MESSAGES: 500
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    volumes:
      - mailpit_data:/data

  # ── MySQL test database ─────────────────────────────────────────────────────
  # Use this if you don't have a local MySQL. Skip if you have one already.
  # Configure CI4 .env to: DB_HOST=127.0.0.1 DB_PORT=3307 DB_DATABASE=billingtool_test
  mysql_test:
    image: mysql:8.0
    container_name: billingtool_mysql_test
    restart: unless-stopped
    ports:
      - '3307:3306'
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: billingtool_test
      MYSQL_USER: billingtool
      MYSQL_PASSWORD: billingtool_test_pass
    volumes:
      - mysql_test_data:/var/lib/mysql
    command: '--character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci'

volumes:
  mailpit_data:
  mysql_test_data:
